name: Public examples quality

on:
  push:
    branches: [Principal]
  pull_request:
    branches: [Principal]

jobs:
  backend-examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
